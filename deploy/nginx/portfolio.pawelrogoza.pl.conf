# nginx vhost dla portfolio.pawelrogoza.pl
#
# Instalacja na VPS:
#   1. sudo cp portfolio.pawelrogoza.pl.conf /etc/nginx/sites-available/
#   2. sudo ln -s /etc/nginx/sites-available/portfolio.pawelrogoza.pl.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. HTTPS: sudo certbot --nginx -d portfolio.pawelrogoza.pl
#      (certbot sam dopisze blok :443 i przekierowanie z HTTP)
#
# Pamiętaj o rekordzie DNS: portfolio.pawelrogoza.pl -> A/AAAA na IP VPS-a.

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.pawelrogoza.pl;

    root /var/www/portfolio;
    index index.html;

    # kompresja
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # podstawowe nagłówki bezpieczeństwa
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # cache dla statyków
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
