# nginx vhost dla portfolio.pawelrogoza.pl
#
# Strona serwowana bezpośrednio z klona repo: /home/portfolio/portfolio
# (root wskazuje na podkatalog public/ — reszta repo nie jest wystawiona).
#
# Instalacja na VPS:
#   1. nginx (www-data) musi móc wejść do katalogu domowego usera:
#        sudo chmod o+x /home/portfolio
#      (na Ubuntu 21.04+ home tworzony jest z prawami 750)
#   2. sudo cp portfolio.pawelrogoza.pl.conf /etc/nginx/sites-available/
#   3. sudo ln -s /etc/nginx/sites-available/portfolio.pawelrogoza.pl.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. HTTPS: sudo certbot --nginx -d portfolio.pawelrogoza.pl
#      (certbot sam dopisze blok :443 i przekierowanie z HTTP)
#
# Pamiętaj o rekordzie DNS: portfolio.pawelrogoza.pl -> A/AAAA na IP VPS-a.

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.pawelrogoza.pl;

    root /home/portfolio/portfolio/public;
    index index.html;
    charset utf-8;

    # kompresja
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml
               application/javascript application/json
               image/svg+xml;

    # ---- nagłówki bezpieczeństwa -------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Strona jest w 100% statyczna i nie ma ani jednego inline <script>/<style>
    # (motyw ustawia osobny js/theme.js) — dzięki temu CSP może być ścisłe.
    # Jedyny wyjątek to Google Fonts; jeśli kiedyś zhostujesz fonty lokalnie,
    # usuń oba wpisy fonts.* i zostaw samo 'self'.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # HSTS włącz dopiero, gdy HTTPS działa na pewno (certbot dopisze blok :443):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # nigdy nie serwuj plików ukrytych
    location ~ /\. {
        deny all;
    }

    # UWAGA: `add_header` w bloku location KASUJE wszystkie add_header
    # odziedziczone z server {} — dlatego poniżej sterujemy cache wyłącznie
    # dyrektywą `expires`, która nagłówków bezpieczeństwa nie zeruje.

    # CSS i JS: zawsze rewaliduj. Nazwy plików nie są hashowane, więc przy
    # `expires 7d` powracający odwiedzający dostawał po deployu nowy HTML ze
    # starym arkuszem — layout rozjeżdżał się aż do wygaśnięcia cache.
    # `expires -1` wysyła Cache-Control: no-cache, czyli warunkowe zapytanie
    # i odpowiedź 304 (~200 bajtów) zamiast pełnego pobrania.
    location ~* \.(css|js)$ {
        expires -1;
    }

    # obrazki i fonty zmieniają się rzadko, a nieświeży favicon nikomu nie szkodzi
    location ~* \.(svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 7d;
    }

    # index.html zawsze świeży, żeby deploy był widoczny od razu
    # (`expires -1` wysyła Cache-Control: no-cache)
    location = /index.html {
        expires -1;
    }
}
