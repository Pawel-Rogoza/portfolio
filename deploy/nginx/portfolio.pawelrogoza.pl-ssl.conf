# nginx vhost dla portfolio.pawelrogoza.pl — wersja PO certbocie (:80 → :443).
#
# To jest docelowy kształt ZAINSTALOWANEGO vhosta na VPS-ie, czyli tego, który
# certbot --nginx przepisał. Odpowiednik "czystego" portfolio.pawelrogoza.pl.conf
# z tego katalogu, ale z blokiem TLS i przekierowaniem z HTTP.
#
# Instalacja (RĘCZNA — patrz README, sekcja "Certbot przepisuje vhost"):
#   1. sprawdź ścieżki certyfikatów: ls /etc/letsencrypt/live/
#   2. Debian/Ubuntu:
#        sudo cp deploy/nginx/portfolio.pawelrogoza.pl-ssl.conf \
#          /etc/nginx/sites-available/portfolio.pawelrogoza.pl.conf
#      (RHEL-family: do /etc/nginx/conf.d/, bez sites-enabled)
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. nie zamykaj bieżącej sesji SSH, dopóki nie potwierdzisz, że strona
#      działa po HTTPS (curl -I https://portfolio.pawelrogoza.pl/)
#
# Po wgraniu tej wersji .css/.js są rewalidowane przy każdym wejściu
# (`expires -1` = Cache-Control: no-cache), więc podbijanie ?v= w index.html
# przestaje być potrzebne — deploy jest widoczny od razu, kosztem odpowiedzi
# 304 (~200 bajtów) na plik.

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.pawelrogoza.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 wymaga nginx >= 1.25.1; na starszym usuń tę linię
    # (albo użyj starej składni: listen 443 ssl http2;)
    http2 on;
    server_name portfolio.pawelrogoza.pl;

    ssl_certificate     /etc/letsencrypt/live/portfolio.pawelrogoza.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.pawelrogoza.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/portfolio/portfolio/public;
    index index.html;
    charset utf-8;

    # kompresja
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml
               application/javascript application/json
               image/svg+xml;

    # ---- nagłówki bezpieczeństwa -------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # HTTPS działa (deploy robi health check po https), więc HSTS jest włączony.
    # includeSubDomains obejmuje też przyszłe subdomeny — świadoma decyzja.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Wyjątek dla odnowień Let's Encrypt: prefiks ^~ wygrywa z regexowym
    # deny na pliki ukryte poniżej. Z pluginem --nginx certbot i tak wstrzykuje
    # własny blok na czas challenge'u, ale ten wyjątek nic nie kosztuje
    # i ratuje odnowienia także w wariancie webroot.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # nigdy nie serwuj plików ukrytych
    location ~ /\. {
        deny all;
    }

    # UWAGA: `add_header` w bloku location KASUJE wszystkie add_header
    # odziedziczone z server {} — dlatego cache jest sterowany wyłącznie
    # dyrektywą `expires`, która nagłówków bezpieczeństwa nie zeruje.

    # CSS i JS: zawsze rewaliduj. Nazwy plików nie są hashowane, więc długi
    # cache oznaczałby "nowy HTML ze starym skryptem" po każdym deployu.
    location ~* \.(css|js)$ {
        expires -1;
    }

    # obrazki i fonty zmieniają się rzadko, nieświeży favicon nikomu nie szkodzi
    location ~* \.(svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 7d;
    }

    # index.html zawsze świeży, żeby deploy był widoczny od razu
    location = /index.html {
        expires -1;
    }
}
